<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Camera Shoot｜以相機為武器的射擊遊戲</title>
<meta name="theme-color" content="#0d0e11">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Camera Shoot">
<style>
*{box-sizing:border-box}
html,body{overscroll-behavior:none;margin:0;background:#0d0e11;color:#e8e6df;font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px}
#app{width:100%;max-width:960px}
h1{font-size:15px;margin:2px 0 8px;font-weight:600;letter-spacing:.04em;color:#c9c5b8}
h1 small{font-weight:400;color:#7d7a70;margin-left:8px}
#gameWrap{position:relative;width:min(100%,calc((100vh - 72px)*1.6));width:min(100%,calc((100dvh - 72px)*1.6));margin:0 auto;aspect-ratio:960/600;background:#16181d;border:1px solid #2a2d35;border-radius:8px;overflow:hidden}
#c{width:100%;height:100%;display:block;cursor:default;touch-action:none}
.hint{font-size:12px;color:#8a877c;margin:8px 2px;line-height:1.7}
.hint kbd{background:#23252c;border:1px solid #363a44;border-radius:4px;padding:0 5px;font-size:11px;color:#d6d3c8}
.hidden{display:none!important}
.album{grid-column:1/-1}
.alsum{background:#1e2027;border:1px solid #2f323b;border-radius:8px;padding:10px 12px;margin-bottom:10px;font-size:13px;color:#b9b6aa;line-height:1.7}
.alsum b{color:#f3f1ea}
.alth{background:#1b1d23;border:1px solid #2a2d35;border-radius:8px;padding:8px 10px;margin-bottom:8px}
.alth.done{border-color:#e0a526;box-shadow:0 0 0 1px #e0a52644 inset}
.alth h4{margin:0 0 6px;font-size:14px;color:#e8e6df;display:flex;justify-content:space-between;gap:8px}
.alth h4 span{font-weight:400;font-size:12px;color:#8a877c}
.alth.done h4 span{color:#f0c24a}
.alrow{display:grid;grid-template-columns:repeat(4,minmax(0,150px));gap:8px;justify-content:start}
.alc{background:#14161b;border:1px solid #2a2d35;border-radius:6px;padding:6px;text-align:center;font-size:12px;color:#b9b6aa}
.alc .ph{width:100%;aspect-ratio:1;background:#0c0d10;border-radius:3px;display:flex;align-items:center;justify-content:center;color:#3a3d46;font-size:26px;overflow:hidden;position:relative}
.alc.got .ph{background:#f3efe4;padding:4px 4px 12px}
.alc.got .ph img{width:100%;height:100%;object-fit:cover;display:block}
.alc b{display:block;margin-top:4px;color:#e8e6df;font-weight:600}
.alc.boss{border-color:#6b3a3a}
#touch{position:absolute;inset:0;pointer-events:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
#joyZone{position:absolute;left:0;bottom:0;width:50%;height:70%;pointer-events:auto;touch-action:none}
#joyBase{position:absolute;width:20%;aspect-ratio:1;max-width:130px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25);transform:translate(-50%,-50%);display:none;pointer-events:none}
#joyKnob{position:absolute;left:50%;top:50%;width:44%;height:44%;border-radius:50%;background:rgba(255,255,255,.35);border:2px solid rgba(255,255,255,.55);transform:translate(-50%,-50%)}
.tbtn{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:rgba(224,165,38,.35);color:#fff;font-size:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.tbtn small{font-size:10px;opacity:.9}
.tbtn:active{background:rgba(224,165,38,.7)}
#tFlash{right:3%;bottom:8%;width:17%;max-width:110px;aspect-ratio:1}
#tReload{right:21%;bottom:5%;width:12%;max-width:78px;aspect-ratio:1;background:rgba(80,140,220,.35)}
#rotHint{display:none;position:absolute;left:50%;top:6px;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#f0c24a;font-size:11px;padding:3px 8px;border-radius:10px;pointer-events:none;white-space:nowrap}
@media (orientation:portrait){#touch.on #rotHint{display:block}}
#over{position:absolute;inset:0;background:rgba(8,8,10,.78);display:flex;align-items:center;justify-content:center}
#over .box{background:#1a1c22;border:1px solid #3a3e49;border-radius:10px;padding:22px 26px;text-align:center;max-width:90%}
#over h2{margin:0 0 6px;font-size:20px;color:#ff8a76}
#over p{margin:4px 0 14px;color:#b9b6aa;font-size:14px}
button{font:inherit;cursor:pointer}
.btn{background:#e0a526;color:#1a1304;border:0;border-radius:6px;padding:9px 16px;font-weight:700;font-size:14px}
.btn:hover{background:#f0b638}
.btn.ghost{background:#2a2d35;color:#d6d3c8;margin-left:8px}
.btn.ghost:hover{background:#363a44}
/* shop */
#shop{background:#16181d;border:1px solid #2a2d35;border-radius:8px;padding:14px}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px}
.gold{font-size:20px;font-weight:700;color:#f0c24a}
.gold::before{content:"● ";color:#e0a526}
.load{font-size:13px;color:#b9b6aa;background:#1e2027;border:1px solid #2f323b;border-radius:6px;padding:7px 10px;margin-bottom:10px;line-height:1.7}
.load b{color:#f3f1ea}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tab{background:#22252d;color:#b9b6aa;border:1px solid #30343d;border-radius:6px;padding:7px 14px;font-size:14px}
.tab.on{background:#e0a526;color:#1a1304;border-color:#e0a526;font-weight:700}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.item{background:#1e2027;border:1px solid #2f323b;border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:5px}
.item.eq{border-color:#e0a526;box-shadow:0 0 0 1px #e0a52655 inset}
.item.own .price{color:#7fc88a}
.ih{display:flex;gap:10px;align-items:center}
.ih .it{min-width:0}
.ico{flex:0 0 132px;height:84px;background:linear-gradient(#2a2d37,#1a1c22);border:1px solid #343845;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ico svg{width:128px;height:80px}
.item.own .ico{border-color:#3b5f45}
.item.eq .ico{border-color:#e0a526}
.loadwrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.rig{flex:0 0 340px;max-width:100%;background:linear-gradient(#262932,#171920);border:1px solid #343845;border-radius:10px;padding:4px 6px}
.rig svg{width:100%;height:auto;display:block}
.ih h3{margin:0;font-size:15px}
.ih .sub{font-size:12px;color:#8a877c}
.stat{display:grid;grid-template-columns:62px 1fr 56px;gap:6px;align-items:center;font-size:12px;color:#a9a69a}
.bar{height:6px;background:#2a2d35;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:#e0a526}
.stat b{text-align:right;color:#e8e6df;font-weight:600}
.ia{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.price{font-weight:700;color:#f0c24a;font-size:14px}
.ia button{background:#e0a526;color:#1a1304;border:0;border-radius:6px;padding:6px 12px;font-weight:700;font-size:13px}
.ia button:disabled{background:#2a2d35;color:#6d6a60;cursor:not-allowed}
.note{font-size:11.5px;color:#9a8a6a}
#msg{min-height:20px;margin-top:10px;font-size:13px;color:#f0c24a}
</style>
</head>
<body>
<div id="app">
  <h1>CAMERA SHOOT<small>以相機為武器的射擊遊戲 v2.2</small></h1>

  <div id="gameWrap" class="hidden">
    <canvas id="c" width="960" height="600"></canvas>
    <div id="touch" class="hidden">
      <div id="joyZone"></div><div id="joyBase"><div id="joyKnob"></div></div>
      <button class="tbtn" id="tReload">🔄<small>換卡</small></button>
      <button class="tbtn" id="tFlash">💥<small>閃光燈</small></button>
      <div id="rotHint">建議橫向持機</div>
    </div>
    <div id="over" class="hidden">
      <div class="box">
        <h2 id="overTitle">任務失敗</h2>
        <p id="overTxt"></p>
        <button class="btn hidden" id="endless">繼續挑戰（無盡模式）</button>
        <button class="btn" id="retry">回商店重新挑戰此波</button>
        <button class="btn ghost" id="restart">完全重來</button>
      </div>
    </div>
  </div>

  <div id="shop">
    <div class="top">
      <div class="gold" id="gold">0</div>
      <span style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><button class="btn ghost" id="tglTouch" style="margin:0;padding:6px 10px;font-size:12px">觸控：自動</button><button class="btn ghost" id="wipe" style="margin:0;padding:6px 10px;font-size:12px">清除存檔</button><button class="btn" id="go">開始第 1 波</button></span>
    </div>
    <div class="load" id="load"></div>
    <div class="tabs" id="tabs"></div>
    <div id="list"></div>
    <div id="msg"></div>
  </div>

  <div class="hint">
    <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 或方向鍵 移動（只需控制走位）　自動鎖定最近敵人並開火，子彈會追蹤目標　<kbd>G</kbd> / <kbd>空白鍵</kbd> / 點畫面 丟閃光燈（自動丟向敵人最密集處）　<kbd>R</kbd> 手動換記憶卡（彈夾空了會自動換）　<kbd>M</kbd> 靜音<br>
    手機／平板：左側拖曳虛擬搖桿移動，右側按鈕丟閃光燈／換卡；商店階段會自動存檔（瀏覽器 localStorage），擊殺圖鑑也會保留。
  </div>
</div>

<script>
'use strict';
/* ============================== CONFIG ============================== */
// 機身：強度依你指定的順序（R6 III 排在 R5 II 之前）
// track = 子彈追蹤轉向速度(rad/s)，越高越容易咬住目標；slots = 該機身可使用的記憶卡類型（遊戲設定，可自行調整）
const CAMERAS=[
 {id:'500d',short:'500D',name:'Canon EOS 500D',year:2009,dmg:12,rate:2.5,spread:8,track:5,hp:100,speed:200,price:0   ,slots:['SD']},
 {id:'60d' ,short:'60D' ,name:'Canon EOS 60D' ,year:2010,dmg:16,rate:3.2,spread:7,track:5.5,hp:110,speed:204,price:250 ,slots:['SD']},
 {id:'5d3' ,short:'5D3' ,name:'Canon EOS 5D Mark III',year:2012,dmg:21,rate:4  ,spread:6,track:6.5,hp:125,speed:208,price:700 ,slots:['SD','CF']},
 {id:'1dx3',short:'1DX3',name:'Canon EOS-1D X Mark III',year:2020,dmg:28,rate:5.5,spread:5,track:7.5,hp:150,speed:212,price:1500,slots:['CFX']},
 {id:'r8'  ,short:'R8'  ,name:'Canon EOS R8'  ,year:2022,dmg:36,rate:7  ,spread:4,track:8.5,hp:175,speed:218,price:4000,slots:['SD']},
 {id:'r6m3',short:'R6 III',name:'Canon EOS R6 Mark III',year:2025,dmg:46,rate:8.5,spread:3,track:9.5,hp:205,speed:224,price:6500,slots:['SD','CFX']},
 {id:'r5m2',short:'R5 II',name:'Canon EOS R5 Mark II',year:2024,dmg:58,rate:10 ,spread:2,track:11,hp:240,speed:230,price:9500,slots:['SD','CFX']},
 {id:'r1'  ,short:'R1'  ,name:'Canon EOS R1'  ,year:2024,dmg:75,rate:12 ,spread:1,track:13,hp:280,speed:236,price:14000,slots:['SD','CFX']},
];
// 記憶卡 = 彈夾。cap = 容量(彈藥數)；換彈時間由卡種決定
const CARDTYPES={SD:{label:'SD',reload:2.2},CF:{label:'CF',reload:1.4},CFX:{label:'CFexpress',reload:0.7}};
const CARDS=[
 {id:'sd8'   ,type:'SD' ,name:'SD 8GB'          ,cap:30  ,price:0},
 {id:'sd32'  ,type:'SD' ,name:'SD 32GB'         ,cap:60  ,price:100},
 {id:'sd128' ,type:'SD' ,name:'SD 128GB'        ,cap:120 ,price:350},
 {id:'cf64'  ,type:'CF' ,name:'CF 64GB'         ,cap:100 ,price:300},
 {id:'cf256' ,type:'CF' ,name:'CF 256GB'        ,cap:240 ,price:800},
 {id:'cfx128',type:'CFX',name:'CFexpress 128GB' ,cap:180 ,price:700},
 {id:'cfx512',type:'CFX',name:'CFexpress 512GB' ,cap:480 ,price:2200},
 {id:'cfx1t' ,type:'CFX',name:'CFexpress 1TB'   ,cap:1000,price:5000},
];
// 閃光燈 = 手雷。dmg 傷害、radius 範圍(px)、stun 暈眩秒數、carry 每波可攜帶數、cd 丟擲冷卻、ammoPrice 單顆補充價
const FLASHES=[
 {id:'pop'   ,name:'機身內建閃光燈'          ,dmg:50 ,radius:90 ,stun:1.0,carry:2,cd:1.2,price:0   ,ammoPrice:20},
 {id:'430'   ,name:'Speedlite 430EX III-RT' ,dmg:100,radius:120,stun:1.5,carry:3,cd:1.2,price:200 ,ammoPrice:35},
 {id:'600'   ,name:'Speedlite 600EX II-RT'  ,dmg:200,radius:150,stun:2.0,carry:3,cd:1.1,price:700 ,ammoPrice:60},
 {id:'el1'   ,name:'Speedlite EL-1'         ,dmg:400,radius:185,stun:2.5,carry:4,cd:1.0,price:1800,ammoPrice:100},
 {id:'studio',name:'攝影棚大型爆閃燈'        ,dmg:900,radius:230,stun:3.2,carry:5,cd:0.9,price:4000,ammoPrice:160},
];
// 接環：EFS = EF-S（僅 APS-C 單眼 500D/60D）、EF（單眼；R 系列需轉接環）、RF（僅 R 系列）
const MOUNTNAME={EFS:'EF-S',EF:'EF',RF:'RF'};
const CAMMOUNTS={'500d':['EFS','EF'],'60d':['EFS','EF'],'5d3':['EF'],'1dx3':['EF'],'r8':['RF','EF','EFS'],'r6m3':['RF','EF','EFS'],'r5m2':['RF','EF','EFS'],'r1':['RF','EF','EFS']};
CAMERAS.forEach(c=>{c.mounts=CAMMOUNTS[c.id];});
const mountText=c=>c.mounts.includes('RF')?'RF（EF / EF-S 鏡頭需轉接環，EF-S 會裁切）':c.mounts.map(m=>MOUNTNAME[m]).join(' / ');
// 彈種平衡原則：射速 標準 > 廣角(散彈) > 長焦(狙擊) > 超長焦(飛彈)；單次傷害相反（飛彈 > 狙擊 > 散彈 > 標準）
// 彈種基礎：n 彈丸數、dmg 傷害倍率、rate 射速倍率、cost 每次耗彈、spread 散射半角(度)、acc 機身散布影響、
// spd 彈速、life 飛行秒數、trk 追蹤倍率、pierce 內建穿透數、splash 爆炸半徑(px)
const KINDS={
 std :{label:'標準彈',n:1,dmg:1  ,rate:1  ,cost:1,spread:0 ,acc:1 ,spd:1100,life:.8 ,trk:1  ,pierce:0,splash:0 ,col:'#fffbe0',size:2.5,desc:'標準鏡頭：均衡的子彈，追蹤良好'},
 wide:{label:'散彈'  ,n:6,dmg:.33,rate:.75,cost:2,spread:20,acc:1 ,spd:950 ,life:.38,trk:.35,pierce:0,splash:0 ,col:'#ffd27a',size:2  ,desc:'廣角鏡頭：一次射出 6 發扇形彈丸，近距離爆發高，射程短，每次耗 2 發'},
 tele:{label:'狙擊彈',n:1,dmg:3  ,rate:.35,cost:1,spread:0 ,acc:0 ,spd:2200,life:.6 ,trk:2  ,pierce:1,splash:0 ,col:'#bfe3ff',size:3.5,desc:'望遠鏡頭：高傷害、極遠、近乎必中，自帶穿透 1 個敵人（每穿透一個傷害 ×0.75），射速慢'},
 rkt :{label:'飛彈'  ,n:1,dmg:3.3,rate:.3 ,cost:3,spread:0 ,acc:.5,spd:520 ,life:2.2,trk:1.2,pierce:0,splash:70,sm:.5,col:'#ff8a3c',size:5  ,desc:'超望遠鏡頭：慢速強追蹤，命中爆炸，周圍敵人受 50% 傷害，每次耗 3 發'},
};
// 真實佳能鏡頭。kind=彈種、q=光學等級（提升傷害、射速、追蹤）、mount=接環
const LENSDEFS=[
 {id:'efs1855' ,name:'EF-S 18-55mm f/3.5-5.6 IS STM'  ,mount:'EFS',kind:'std' ,q:1.0 ,price:0   ,note:'入門套鏡'},
 {id:'efs1018' ,name:'EF-S 10-18mm f/4.5-5.6 IS STM'  ,mount:'EFS',kind:'wide',q:1.0 ,price:350 },
 {id:'efs55250',name:'EF-S 55-250mm f/4-5.6 IS STM'   ,mount:'EFS',kind:'tele',q:.9  ,price:900 },
 {id:'ef50'    ,name:'EF 50mm f/1.8 STM'              ,mount:'EF' ,kind:'std' ,q:1.0 ,price:150 ,note:'小小白'},
 {id:'ef2470'  ,name:'EF 24-70mm f/2.8L II USM'       ,mount:'EF' ,kind:'std' ,q:1.2 ,price:800 },
 {id:'ef50l'   ,name:'EF 50mm f/1.2L USM'             ,mount:'EF' ,kind:'std' ,q:1.3 ,price:1300},
 {id:'ef1635f4',name:'EF 16-35mm f/4L IS USM'         ,mount:'EF' ,kind:'wide',q:1.0 ,price:600 },
 {id:'ef1635'  ,name:'EF 16-35mm f/2.8L III USM'      ,mount:'EF' ,kind:'wide',q:1.2 ,price:1100},
 {id:'ef100400',name:'EF 100-400mm f/4.5-5.6L IS II USM',mount:'EF',kind:'tele',q:1.0 ,price:1300},
 {id:'ef200400',name:'EF 200-400mm f/4L IS USM Ext 1.4x',mount:'EF',kind:'tele',q:1.25,price:3200},
 {id:'ef400'   ,name:'EF 400mm f/2.8L IS III USM'     ,mount:'EF' ,kind:'rkt' ,q:1.0 ,price:2400},
 {id:'ef600'   ,name:'EF 600mm f/4L IS III USM'       ,mount:'EF' ,kind:'rkt' ,q:1.3 ,price:4200},
 {id:'rf50'    ,name:'RF 50mm f/1.8 STM'              ,mount:'RF' ,kind:'std' ,q:1.0 ,price:150 },
 {id:'rf2470'  ,name:'RF 24-70mm f/2.8L IS USM'       ,mount:'RF' ,kind:'std' ,q:1.2 ,price:900 },
 {id:'rf85'    ,name:'RF 85mm f/1.2L USM'             ,mount:'RF' ,kind:'std' ,q:1.35,price:1500},
 {id:'rf16'    ,name:'RF 16mm f/2.8 STM'              ,mount:'RF' ,kind:'wide',q:.95 ,price:400 },
 {id:'rf1535'  ,name:'RF 15-35mm f/2.8L IS USM'       ,mount:'RF' ,kind:'wide',q:1.25,price:1300},
 {id:'rf100500',name:'RF 100-500mm f/4.5-7.1L IS USM' ,mount:'RF' ,kind:'tele',q:1.1 ,price:1900},
 {id:'rf200800',name:'RF 200-800mm f/6.3-9 IS USM'    ,mount:'RF' ,kind:'tele',q:1.2 ,price:2800},
 {id:'rf800'   ,name:'RF 800mm f/5.6L IS USM'         ,mount:'RF' ,kind:'tele',q:1.45,price:5200},
 {id:'rf600'   ,name:'RF 600mm f/4L IS USM'           ,mount:'RF' ,kind:'rkt' ,q:1.3 ,price:4200},
 {id:'rf1200'  ,name:'RF 1200mm f/8L IS USM'          ,mount:'RF' ,kind:'rkt' ,q:1.5 ,price:6500},
];
const LENSES=LENSDEFS.map(d=>{const k=KINDS[d.kind];
  return Object.assign({},k,d,{type:d.kind,kind:k.label,dmg:k.dmg*d.q,rate:k.rate*(1+(d.q-1)*.4),trk:k.trk*(1+(d.q-1)*.6),desc:k.desc+(d.note?'（'+d.note+'）':'')});});
// 濾鏡 = 彈藥效果（一次裝備一種，可搭配任何鏡頭）
const FILTERS=[
 {id:'uv'  ,short:'UV'  ,name:'UV 保護鏡' ,fx:null   ,price:0   ,col:null     ,desc:'無特殊效果'},

function loadGame(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);if(!raw)return false;
    const d=JSON.parse(raw),L=d&&d.S;if(!d||d.v!==1||!L)return false;
    newGame();
    for(const k of ['gold','wave','kills','best','hp','reserve','grenades'])if(typeof L[k]==='number'&&isFinite(L[k]))S[k]=L[k];
    S.endless=!!L.endless;muted=!!d.muted;
    for(const [k,arr] of [['ownCam',CAMERAS],['ownCard',CARDS],['ownFl',FLASHES],['ownLens',LENSES],['ownFilt',FILTERS],['ownAcc',ACCS]])
      for(const x of arr)if(L[k]&&L[k][x.id])S[k][x.id]=1;
    const pick=(key,own,arr,def)=>{S[key]=(L[key]&&own[L[key]]&&arr.some(x=>x.id===L[key]))?L[key]:def;};
    pick('cam',S.ownCam,CAMERAS,'500d');pick('card',S.ownCard,CARDS,'sd8');pick('fl',S.ownFl,FLASHES,'pop');pick('lens',S.ownLens,LENSES,'efs1855');pick('filt',S.ownFilt,FILTERS,'uv');
    if(L.acc)for(const c of ['grip','bag','refl','batt']){const id=L.acc[c];S.acc[c]=(id&&S.ownAcc[id]&&ACCS.some(a=>a.id===id&&a.cat===c))?id:null;}
    if(L.cardMag)for(const c of CARDS)if(typeof L.cardMag[c.id]==='number')S.cardMag[c.id]=clamp(L.cardMag[c.id],0,c.cap);
    for(const c of CARDS)if(S.cardMag[c.id]==null&&S.ownCard[c.id])S.cardMag[c.id]=c.cap;
    if(L.album)for(const k in L.album){const a=L.album[k];if(/^\d+-(walker|runner|tank|boss)$/.test(k)&&a&&a.n>0)S.album[k]={n:a.n|0,img:typeof a.img==='string'&&a.img.startsWith('data:image/')?a.img:''};}
    if(L.albumSets)for(const k in L.albumSets)if(/^\d+$/.test(k)&&THEMES[+k])S.albumSets[k]=1;
    if(!compat(curCam(),curCard())){const c=bestOwnedCardFor(curCam());if(c)S.card=c.id;}
    if(!lcompat(curCam(),curLens())){const l=bestOwnedLensFor(curCam());if(l)S.lens=l.id;}
    S.hp=clamp(S.hp,1,maxHP());S.reserve=clamp(S.reserve,0,reserveCap());S.grenades=clamp(S.grenades,0,curFl().carry);
    return true;

}

let AC=null,muted=false,noiseBuf=null;

function snd(kind){

/* ---------- 波次 ---------- */
function composeWave(w){

  const pt=idx>=2?Math.min(.25,.08+idx*.03+Math.floor(w/10)*.02):0, pr=idx>=1?Math.min(.35,.12+idx*.04):0;
  for(let i=0;i<n;i++){
    const r=Math.random();

  }
  if(w%5===0){
    const nb=Math.min(3,1+Math.floor(w/10));

  const iy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
  let mx=ix,my=iy,il=Math.hypot(ix,iy)||1;
  if(joy.on&&!ix&&!iy){mx=joy.x;my=joy.y;il=Math.max(1,Math.hypot(mx,my));}   // 虛擬搖桿：類比移動
  P.x=clamp(P.x+mx/il*cam.speed*dt,16,W-16);
  P.y=clamp(P.y+my/il*cam.speed*dt,16,H-16);
  if((mx||my)&&Math.random()<dt*14)smokePuff(P.x-mx/il*8,P.y-my/il*8+8,1,2.2,.13);
  P.iframes=Math.max(0,P.iframes-dt);P.muzzle=Math.max(0,P.muzzle-dt);
  P.flashCd=Math.max(0,P.flashCd-dt);P.shotCd=Math.max(0,P.shotCd-dt);
  P.shieldT+=dt;P.shHit=Math.max(0,P.shHit-dt);
  if(S.shield<shieldMax()&&P.shieldT>6)S.shield=Math.min(shieldMax(),S.shield+shieldMax()/6*dt);
  updateTarget();
  if(target)P.ang=target.a;else if(ix||iy)P.ang=Math.atan2(iy,ix);
  // 換彈（彈夾空了自動換卡）
  if(P.reloading){P.reloadT-=dt;if(P.reloadT<=0)finishReload();}
  else if(getMag()<=0&&S.reserve>0)startReload();
  // 自動開火
  if(target&&target.d<=lensRange()&&!P.reloading&&P.shotCd<=0&&getMag()>0)fire();
  // 閃光彈
  for(let i=nades.length-1;i>=0;i--){
    const n=nades[i];n.t+=dt;
    const k=Math.min(1,n.t/n.dur);n.x=P.x+(n.tx-P.x)*k;n.y=P.y+(n.ty-P.y)*k;
    if(n.t>=n.dur){n.x=n.tx;n.y=n.ty;explode(n);nades.splice(i,1);}
  }
  // 子彈
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    // 追蹤：目標死亡或已被穿透過，改追最近的未命中敵人；轉向速度受機身與鏡頭影響
    if(b.track>0){
      if(!b.tg||b.tg.hp<=0||enemies.indexOf(b.tg)<0||b.hitSet.has(b.tg)){
        b.tg=null;let bd=500;
        for(const e of enemies){if(e.hp<=0||b.hitSet.has(e))continue;const d=Math.hypot(e.x-b.x,e.y-b.y);if(d<bd){bd=d;b.tg=e;}}
      }
      if(b.tg){
        const sp=Math.hypot(b.vx,b.vy),cur=Math.atan2(b.vy,b.vx);
        const df=angDiff(Math.atan2(b.tg.y-b.y,b.tg.x-b.x),cur);
        const na=cur+clamp(df,-b.track*dt,b.track*dt);
        b.vx=Math.cos(na)*sp;b.vy=Math.sin(na)*sp;
      }
    }
    if(b.splash&&Math.random()<dt*45)smokePuff(b.x,b.y,1,3.5,.25);
    b.px=b.x;b.py=b.y;b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    let dead=false;
    for(const e of enemies){
      if(e.hp<=0||b.hitSet.has(e))continue;
      if(segDist(e.x,e.y,b.px,b.py,b.x,b.y)<e.r+3){
        b.hitSet.add(e);
        if(b.splash){blast(b,e);dead=true;break;}
        hitEnemy(b,e,b.dmg*Math.pow(PIERCE_FALL,b.hitSet.size-1));   // 每穿透一個目標，傷害遞減
        if(b.pierce>0)b.pierce--;else{dead=true;break;}
      }
    }
    if(!dead&&b.life<=0&&b.splash){blast(b,null);dead=true;}
    if(dead||b.life<=0||b.x<-20||b.x>W+20||b.y<-20||b.y>H+20)bullets.splice(i,1);
  }
  reapDead();
  // 生成敵人
  spawnT-=dt;
  if(spawnQ.length&&spawnT<=0&&enemies.length<45){spawnEnemy(spawnQ.shift());spawnT=Math.max(.22,.8-S.wave*.02);}
  // 敵人移動與接觸傷害
  for(const e of enemies){
    e.hit=Math.max(0,e.hit-dt);
    if(e.burn>0){e.burn-=dt;e.hp-=e.burnDps*dt;}
    if(e.slow>0)e.slow-=dt;
    if(e.stun>0){e.stun-=dt;continue;}
    if(e.t==='boss')bossAI(e,dt);
    const sm=e.slow>0?.5:1;
    const dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy)||1,th=THEMES[e.th];
    let vx=dx/d,vy=dy/d,mul=1;
    if(th.dash&&!e.cast){               // 衝刺：預警（幾乎停住）→ 鎖定方向直線衝刺
      e.dc-=dt;
      if(e.ds===1){e.dT-=dt;mul=.1;if(e.dT<=0){e.ds=2;e.dT=th.dash.dur;e.dvx=vx;e.dvy=vy;}}
      else if(e.ds===2){e.dT-=dt;vx=e.dvx;vy=e.dvy;mul=e.t==='boss'?1.8:th.dash.mult;if(e.dT<=0){e.ds=0;e.dc=rnd(th.dash.gap[0],th.dash.gap[1]);}}
      else if(e.dc<=0){e.ds=1;e.dT=th.dash.wind;}
    }
    if(e.cast){                         // 施放技能：預警時幾乎停住；衝撞時沿鎖定方向高速前進
      const c=e.cast;
      if(c.sk.k==='charge'&&c.ph==='act'){vx=c.dx;vy=c.dy;mul=c.sk.spd/e.sp;}else mul*=.15;
    }
    e.ang=Math.atan2(vy,vx);
    e.x+=vx*e.sp*sm*mul*dt;e.y+=vy*e.sp*sm*mul*dt;
    if(d<e.r+13&&P.iframes<=0){
      takeDamage(e.dmg*((e.cast&&e.cast.ph==='act'&&e.cast.sk.k==='charge')?e.cast.sk.dmg:1));P.iframes=.6;
    }
  }
  reapDead();
  for(let i=0;i<enemies.length;i++)for(let j=i+1;j<enemies.length;j++){
    const a=enemies[i],b=enemies[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),m=a.r+b.r;
    if(d>0&&d<m){const p=(m-d)/2*.5/d;a.x-=dx*p;a.y-=dy*p;b.x+=dx*p;b.y+=dy*p;}
  }
  // 掉落物
  for(let i=drops.length-1;i>=0;i--){
    const d=drops[i];d.life-=dt;
    if(Math.hypot(d.x-P.x,d.y-P.y)<22){
      if(d.type==='ammo'){const g=Math.round(card.cap*.4);S.reserve=Math.min(reserveCap(),S.reserve+g);floats.push({x:d.x,y:d.y,t:0,txt:'+'+g+' 彈',col:'#8fd0ff'});}
      else{S.hp=Math.min(maxHP(),S.hp+25);floats.push({x:d.x,y:d.y,t:0,txt:'+25 HP',col:'#8fe08f'});}
      drops.splice(i,1);
    }else if(d.life<=0)drops.splice(i,1);
  }
  // Boss 投射物與範圍技能
  for(let i=eproj.length-1;i>=0;i--){
    const q=eproj[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;
    if(Math.hypot(q.x-P.x,q.y-P.y)<q.r+12&&P.iframes<=0){hurtPlayer(q.dmg);eproj.splice(i,1);continue;}
    if(q.life<=0||q.x<-30||q.x>W+30||q.y<-30||q.y>H+30)eproj.splice(i,1);
  }
  for(let i=zones.length-1;i>=0;i--){
    const z=zones[i];
    if(z.src&&(z.src.hp<=0||enemies.indexOf(z.src)<0)){zones.splice(i,1);continue;}
    if(z.follow&&z.src&&!z.fired){z.x=z.src.x;z.y=z.src.y;}
    z.t+=dt;
    if(!z.fired&&z.t>=z.delay){
      z.fired=true;z.ft=0;
      if(z.dmg>0){
        const hit=z.kind==='circle'?Math.hypot(P.x-z.x,P.y-z.y)<z.r+10
          :segDist(P.x,P.y,z.x,z.y,z.x+Math.cos(z.ang)*z.len,z.y+Math.sin(z.ang)*z.len)<z.w/2+10;
        if(hit)hurtPlayer(z.dmg,true);
        if(z.kind==='circle')fx.push({x:z.x,y:z.y,r:z.r,t:0,dur:.3,c:z.c});
      }
    }
    if(z.fired){z.ft+=dt;if(z.ft>.3)zones.splice(i,1);}
  }
  // 特效
  for(let i=fx.length-1;i>=0;i--){fx[i].t+=dt;if(fx[i].t>=fx[i].dur)fx.splice(i,1);}
  for(let i=snaps.length-1;i>=0;i--){const q=snaps[i];q.t+=dt;if(q.t>.2){if(!q.shot){q.shot=true;screenFlash=Math.max(screenFlash,q.boss?.25:.06);ringFx(q.x,q.y,q.boss?60:26,'255,255,255',.25);}q.y+=q.vy*dt;q.vy*=Math.max(0,1-1.6*dt);}if(q.t>=q.dur){q.c.busy=false;snaps.splice(i,1);}}
  for(let i=arcs.length-1;i>=0;i--){arcs[i].t+=dt;if(arcs[i].t>.18)arcs.splice(i,1);}
  for(let i=floats.length-1;i>=0;i--){floats[i].t+=dt;floats[i].y-=26*dt;if(floats[i].t>(floats[i].life||.7))floats.splice(i,1);}

  // 勝負
  if(S.hp<=0){
    if(S.revives>0){                    // 備用電池：復活
      S.revives--;S.hp=Math.max(1,maxHP()*battInfo().pct);P.iframes=2;S.shield=shieldMax();hurtT=0;screenFlash=.5;
      floats.push({x:P.x,y:P.y-30,t:0,txt:'備用電池復活！',col:'#9be37a',big:true,life:1.4});
    }else{S.hp=0;die();return;}
  }
  if(!spawnQ.length&&!enemies.length)winWave();
}

function drawHUD(cam,card,fl){

  }

   ctx.fillStyle=gr;ctx.beginPath();if(ctx.roundRect)ctx.roundRect(14,14,Math.max(0,220*k),16,6);else ctx.rect(14,14,220*k,16);ctx.fill();
   ctx.fillStyle='rgba(255,255,255,.18)';ctx.fillRect(17,16,Math.max(0,220*k-6),4);}
  ctx.fillStyle='#fff';ctx.font='bold 12px '+FONT;ctx.fillText('HP '+Math.ceil(S.hp)+' / '+maxHP(),20,27);

  b+='<circle cx="'+(bR-3)+'" cy="'+(yT+8)+'" r="3" fill="#3a3c44" stroke="#000" stroke-width=".5"/>';   // 快門鈕 / 轉盤
  if(s.fam==='pro')b+='<line x1="'+bx+'" x2="'+(bR+8)+'" y1="'+(yT+bh*.74)+'" y2="'+(yT+bh*.74)+'" stroke="#000" opacity=".5" stroke-width="1.4"/>';

function buy(price){if(S.gold<price){msg('金幣不足');return false;}S.gold-=price;return true;}
function act(a,id){
  const cam=curCam();
  if(a==='buycam'){const c=byId(CAMERAS,id);if(buy(c.price)){S.ownCam[id]=1;msg('已購買 '+c.name+'，記得裝備。');}}
  else if(a==='eqcam'){
    const c=byId(CAMERAS,id);let card=curCard();
    if(!compat(c,card)){card=bestOwnedCardFor(c);}
    let lens=curLens();if(!lcompat(c,lens))lens=bestOwnedLensFor(c);
    if(!card){msg(c.short+' 需要相容的記憶卡（'+c.slots.map(s=>CARDTYPES[s].label).join(' / ')+'），請先到「記憶卡」購買。');}
    else if(!lens){msg(c.short+' 需要相容的鏡頭（接環：'+mountText(c)+'），請先到「鏡頭」購買。');}
    else{
      const ratio=S.hp/maxHP();S.cam=id;S.card=card.id;S.lens=lens.id;
      if(S.cardMag[card.id]==null)S.cardMag[card.id]=card.cap;
      S.hp=Math.max(1,Math.min(maxHP(),maxHP()*ratio));S.reserve=Math.min(S.reserve,reserveCap());
      msg('已裝備 '+c.name+'（記憶卡：'+card.name+'、鏡頭：'+lens.name+'）');
    }
  }
  else if(a==='buycard'){const c=byId(CARDS,id);if(buy(c.price)){S.ownCard[id]=1;S.cardMag[id]=c.cap;msg('已購買 '+c.name);}}
  else if(a==='eqcard'){const c=byId(CARDS,id);if(compat(cam,c)){S.card=id;S.reserve=Math.min(S.reserve,reserveCap());msg('已換上 '+c.name);}}
  else if(a==='buyfl'){const f=byId(FLASHES,id);if(buy(f.price)){S.ownFl[id]=1;msg('已購買 '+f.name);}}
  else if(a==='eqfl'){const f=byId(FLASHES,id);S.fl=id;S.grenades=Math.min(S.grenades,f.carry);msg('已裝備 '+f.name);}
  else if(a==='buylens'){const l=byId(LENSES,id);if(buy(l.price)){S.ownLens[id]=1;msg('已購買 '+l.name);}}
  else if(a==='eqlens'){const l=byId(LENSES,id);if(lcompat(cam,l)){S.lens=id;msg('已裝上 '+l.name);}}
  else if(a==='togglecompat'){onlyCompat=!onlyCompat;}
  else if(a==='buyfilt'){const f=byId(FILTERS,id);if(buy(f.price)){S.ownFilt[id]=1;msg('已購買 '+f.name);}}
  else if(a==='eqfilt'){S.filt=id;msg('已裝上 '+byId(FILTERS,id).name);}
  else if(a==='buyacc'){const x=byId(ACCS,id);if(buy(x.price)){S.ownAcc[id]=1;msg('已購買 '+x.name);}}
  else if(a==='eqacc'){const x=byId(ACCS,id);if(x.cat!=='grip'||gripOk(cam,x)){const old=maxHP();S.acc[x.cat]=id;S.hp=Math.max(1,Math.min(maxHP(),S.hp+Math.max(0,maxHP()-old)));msg('已裝備 '+x.name);}}
  else if(a==='supR'){const c=Math.ceil((reserveCap()-S.reserve)*.35);if(buy(c)){S.reserve=reserveCap();msg('備彈已補滿');}}
  else if(a==='supG'){const f=curFl(),c=(f.carry-S.grenades)*f.ammoPrice;if(buy(c)){S.grenades=f.carry;msg('閃光燈已補滿');}}
  else if(a==='supH'){const c=Math.ceil((maxHP()-S.hp)*.8);if(buy(c)){S.hp=maxHP();msg('生命已回復');}}
  renderShop();
}

    const cm=CAMERAS[CAMERAS.length-1];S.cam=cm.id;
    S.card=bestOwnedCardFor(cm).id;S.lens=bestOwnedLensFor(cm).id;S.fl=FLASHES[FLASHES.length-1].id;
    S.acc.bag='bag3';S.acc.refl='rf3';S.acc.batt='bt3';
    S.acc.grip=(ACCS.filter(a=>a.cat==='grip'&&gripOk(cm,a)).pop()||{}).id||null;
    for(const c of CARDS)S.cardMag[c.id]=c.cap;
    S.hp=maxHP();S.grenades=curFl().carry;S.reserve=reserveCap();
  }
  S.wave=w-1;S.endless=false;msg('已設定從第 '+w+' 波開始'+(full?'（全裝備）':'')+'（測試模式：本次不會覆蓋存檔，重新整理可回到原存檔）');renderShop();
}
if(typeof location!=='undefined'&&/[?&]dev\b/.test(location.search)){   // 開發測試面板：只有網址加 ?dev 才會出現
  const d=document.createElement('div');d.className='load';d.id='jump';d.style.cssText='display:flex;gap:8px;align-items:center;flex-wrap:wrap';
  d.innerHTML='<b>測試跳關：</b>從第 <input id="jw" type="number" min="1" max="99" value="1" style="width:64px;padding:4px;background:#222;color:#fff;border:1px solid #666;border-radius:4px"> 波開始 <button class="btn" id="jkeep" style="padding:4px 10px;font-size:13px">保留目前裝備</button><button class="btn" id="jfull" style="padding:4px 10px;font-size:13px">全裝備＋滿血</button>';
  $('load').before(d);$('jkeep').addEventListener('click',()=>jumpTo(false));$('jfull').addEventListener('click',()=>jumpTo(true));
}
$('retry').addEventListener('click',()=>{
  S.gold=Math.floor(S.gold*.75);S.wave=Math.max(0,S.wave-1);
  S.hp=maxHP();S.grenades=curFl().carry;S.reserve=Math.max(S.reserve,Math.round(reserveCap()*.75));
  showShop('已回到商店，金幣 -25%，可以重新配置後再挑戰。');
});
$('endless').addEventListener('click',()=>{S.endless=true;$('over').classList.add('hidden');showShop('無盡模式開始！主題會循環，難度持續上升。');});
$('restart').addEventListener('click',()=>{newGame();showShop('已重新開始。');});

/* ---------- 觸控操控：浮動虛擬搖桿 + 閃光燈 / 換卡按鈕 ---------- */
let touchPref='auto';try{touchPref=localStorage.getItem('camshoot_touch')||'auto';}catch(e){}
const IS_TOUCH=(typeof matchMedia==='function'&&matchMedia('(pointer:coarse)').matches)||(typeof navigator!=='undefined'&&navigator.maxTouchPoints>0);
const touchOn=()=>touchPref==='on'||(touchPref==='auto'&&IS_TOUCH);
function syncTouch(){
  const on=touchOn()&&mode==='play';$('touch').classList.toggle('hidden',!on);$('touch').classList.toggle('on',on);
  $('tglTouch').textContent='觸控：'+({auto:'自動',on:'開',off:'關'}[touchPref]);
}
{
  const zone=$('joyZone'),base=$('joyBase'),knob=$('joyKnob');let pid=null,cx=0,cy=0,R=50;
  const setJoy=(px,py)=>{
    const dx=px-cx,dy=py-cy,d=Math.hypot(dx,dy),k=d>R?R/d:1,ox=dx*k,oy=dy*k;
    knob.style.transform='translate(calc(-50% + '+ox+'px),calc(-50% + '+oy+'px))';
    const m=Math.min(1,d/R);joy.on=m>.12;joy.x=d?dx/d*m:0;joy.y=d?dy/d*m:0;
  };
  zone.addEventListener('pointerdown',e=>{
    if(pid!==null)return;pid=e.pointerId;zone.setPointerCapture(pid);e.preventDefault();ac();
    const r=$('gameWrap').getBoundingClientRect();cx=e.clientX-r.left;cy=e.clientY-r.top;
    base.style.display='block';base.style.left=cx+'px';base.style.top=cy+'px';R=Math.max(30,base.getBoundingClientRect().width/2);
    cx=e.clientX;cy=e.clientY;setJoy(e.clientX,e.clientY);
  });
  zone.addEventListener('pointermove',e=>{if(e.pointerId===pid){e.preventDefault();setJoy(e.clientX,e.clientY);}});
  const end=e=>{if(e.pointerId!==pid)return;pid=null;joy.on=false;joy.x=joy.y=0;base.style.display='none';};
  zone.addEventListener('pointerup',end);zone.addEventListener('pointercancel',end);
  $('tFlash').addEventListener('pointerdown',e=>{e.preventDefault();ac();if(mode==='play')throwFlash();});
  $('tReload').addEventListener('pointerdown',e=>{e.preventDefault();ac();if(mode==='play')startReload();});
  $('tglTouch').addEventListener('click',()=>{touchPref=touchPref==='auto'?'on':(touchPref==='on'?'off':'auto');try{localStorage.setItem('camshoot_touch',touchPref);}catch(e){}syncTouch();});
  let wipeT=0;
  $('wipe').addEventListener('click',()=>{
    if(Date.now()-wipeT>3000){wipeT=Date.now();$('wipe').textContent='再按一次確認清除';setTimeout(()=>{$('wipe').textContent='清除存檔';},3000);return;}
    try{localStorage.removeItem(SAVE_KEY);}catch(e){}
    cheat=false;newGame();$('wipe').textContent='清除存檔';showShop('已清除存檔（含圖鑑），重新開始。');
  });
}
/* ---------- 主迴圈 ---------- */
function frame(dt){
  dt=Math.min(dt,.05);
  if(mode==='play'){update(dt);if(mode==='play')draw();}
}
let last=0;
function loop(ts){
  const dt=last?(ts-last)/1000:0;last=ts;
  frame(dt);
  requestAnimationFrame(loop);
}
newGame();
const loaded=loadGame();
syncTouch();
showShop(loaded?'已讀取存檔：已打到第 '+S.wave+' 波，金幣 '+S.gold+'。（只在商店階段自動存檔，戰鬥中途離開會回到本波開始前）':'歡迎！先到商店挑選裝備，準備好就按「開始第 1 波」。你有 300 金幣。');
requestAnimationFrame(loop);
</script>
